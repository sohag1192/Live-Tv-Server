jobs:
  deploy:
    # 1. FIX THE UBUNTU NOTICE:
    # Change 'ubuntu-latest' to a specific version to avoid unexpected migration issues.
    runs-on: ubuntu-24.04 

    steps:
      # 2. FIX THE NODE.JS 20 DEPRECATION:
      # Update the specific actions flagged in your screenshot to their next major versions.
      # (If the newer version isn't released yet, GitHub is already safely forcing them to Node 24, so you can ignore the warning until the maintainers release the update).
      
      - name: Checkout repository
        uses: actions/checkout@v5 # Update from v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6 # Update from v5

      # ... (Your build steps go here, if any) ...

      - name: Upload artifact
        uses: actions/upload-artifact@v5 # Update from v4
        with:
          path: '.' # (Adjust your path as needed)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5 # Update from v4
