    <style>
        :root, [data-theme="dark"] {
            --primary: #e50914;
            --primary-glow: rgba(229, 9, 20, 0.4);
            --bg-base: #0a0a0a;
            --bg-surface: rgba(18, 18, 18, 0.95);
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.1);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --badge-bg: rgba(255, 255, 255, 0.12);
            --badge-text: #f3f4f6;
            --chip-bg: rgba(255, 255, 255, 0.08);
            --chip-text: #e5e7eb;
            --nav-bg: rgba(10, 10, 10, 0.88);
        }

        [data-theme="light"] {
            --primary: #0d6efd;
            --primary-glow: rgba(13, 110, 253, 0.35);
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --border-glass: #e2e8f0;
            --text-color: #0f172a;
            --text-muted: #475569;
            --badge-bg: #dbeafe;
            --badge-text: #1d4ed8;
            --chip-bg: #f1f5f9;
            --chip-text: #334155;
            --nav-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="green"] {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-base: #061810;
            --bg-surface: rgba(8, 28, 19, 0.95);
            --bg-card: rgba(16, 185, 129, 0.08);
            --bg-card-hover: rgba(16, 185, 129, 0.15);
            --border-glass: rgba(16, 185, 129, 0.2);
            --text-color: #ecfdf5;
            --text-muted: #6ee7b7;
            --badge-bg: rgba(16, 185, 129, 0.2);
            --badge-text: #a7f3d0;
            --chip-bg: rgba(16, 185, 129, 0.1);
            --chip-text: #d1fae5;
            --nav-bg: rgba(6, 24, 16, 0.9);
        }

        [data-theme="purple"] {
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --bg-base: #0e071c;
            --bg-surface: rgba(22, 12, 42, 0.95);
            --bg-card: rgba(168, 85, 247, 0.08);
            --bg-card-hover: rgba(168, 85, 247, 0.16);
            --border-glass: rgba(168, 85, 247, 0.2);
            --text-color: #faf5ff;
            --text-muted: #c084fc;
            --badge-bg: rgba(168, 85, 247, 0.2);
            --badge-text: #e9d5ff;
            --chip-bg: rgba(168, 85, 247, 0.1);
            --chip-text: #f3e8ff;
            --nav-bg: rgba(14, 7, 28, 0.9);
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top, rgba(229,9,20,0.15) 0%, var(--bg-base) 60%);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding-top: 76px;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .navbar-custom {
            background-color: var(--nav-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 12px 0;
        }

        .navbar-brand {
            color: var(--text-color) !important;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        .navbar-brand i { color: var(--primary); }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 600;
            font-size: 0.88rem;
            padding: 8px 14px !important;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-color) !important;
            background: var(--bg-card);
        }

        .theme-select {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .cinema-container {
            max-width: 1720px;
            margin: 0 auto;
            padding: 20px;
        }

        .player-sticky {
            position: sticky;
            top: 96px;
            z-index: 50;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
        }

        .player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cinema-info-bar {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--bg-surface);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
        }

        .now-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
        }

        .live-tag {
            background: var(--primary);
            color: #fff !important;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .cinema-sidebar {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--border-glass);
            height: calc(100vh - 120px);
            min-height: 580px;
            display: flex;
            flex-direction: column;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            background: var(--bg-card);
            color: var(--text-color);
            outline: none;
            font-size: 0.88rem;
            margin-bottom: 12px;
        }

        .cat-chips-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .cat-chips-row::-webkit-scrollbar { display: none; }

        .chip-btn {
            white-space: nowrap;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 20px;
            background: var(--chip-bg);
            color: var(--chip-text);
            border: 1px solid var(--border-glass);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip-btn.active {
            background: var(--primary) !important;
            color: #ffffff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .cinema-channel-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .cinema-channel-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            min-height: 60px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            outline: none;
        }

        .cinema-channel-card:hover, .cinema-channel-card:focus-visible {
            transform: translateX(4px);
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 2px var(--primary), 0 4px 16px var(--primary-glow);
        }

        .cinema-channel-card.active {
            border-color: var(--primary) !important;
            background: rgba(229, 9, 20, 0.15) !important;
            box-shadow: 0 0 0 1.5px var(--primary), 0 4px 20px var(--primary-glow);
        }

        .card-img-wrap {
            width: 50px;
            min-width: 50px;
            height: 40px;
            border-radius: 8px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .card-img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .card-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            text-align: left;
        }

        .card-header-v1 {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-chno-v1 {
            font-size: 0.72rem;
            font-weight: 800;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .card-name-text {
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-color);
        }

        .card-group-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fav-star-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 0.85rem;
        }

        .fav-star-btn.active { color: #ef4444; }
    </style>
</head>

        function _0xUnlock(encData, key) {
            const raw = atob(encData);
            const S = Array.from({length: 256}, (_, i) => i);
            let j = 0;
            const keyBytes = Array.from(key).map(c => c.charCodeAt(0));
            for (let i = 0; i < 256; i++) {
                j = (j + S[i] + keyBytes[i % keyBytes.length]) % 256;
                [S[i], S[j]] = [S[j], S[i]];
            }
            let i = 0; j = 0;
            const out = new Uint8Array(raw.length);
            for (let x = 0; x < raw.length; x++) {
                i = (i + 1) % 256;
                j = (j + S[i]) % 256;
                [S[i], S[j]] = [S[j], S[i]];
                out[x] = raw.charCodeAt(x) ^ S[(S[i] + S[j]) % 256];
            }
            return new TextDecoder().decode(out);
        }

        const PLAYLIST_REMOTE_URL = 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8';
        const PLAYLIST_LOCAL_URL = '../playlist.m3u';
        const PLAYLIST_FREETV_URL = 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8';
        const CACHE_PLAYLIST_KEY = 'livetv_clean_v5_cinema';
        const CACHE_PLAYLIST_TIME_KEY = 'livetv_clean_v5_cinema_time';

        function parseM3U(data) {
            const lines = data.split('\n');
            const chs = [];
            let cur = {};
            for (let l of lines) {
                l = l.trim();
                if (!l) continue;
                if (l.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                    cur.licenseKey = l.substring(44).trim();
                } else if (l.startsWith('#EXTINF:')) {
                    const idM = l.match(/tvg-id="([^"]+)"/);
                    cur.id = idM ? idM[1] : String(chs.length + 1);
                    const chnoM = l.match(/tvg-chno="([^"]+)"/);
                    cur.chno = chnoM ? chnoM[1] : (chs.length + 1);
                    const logoM = l.match(/tvg-logo="([^"]+)"/);
                    cur.logo = logoM ? logoM[1] : 'https://placehold.co/420x300/1e1e2f/ffffff?text=LIVE%20TV';
                    const grpM = l.match(/group-title="([^"]+)"/);
                    cur.group = grpM ? grpM[1] : 'General';
                    const comma = l.lastIndexOf(',');
                    cur.name = comma !== -1 ? l.substring(comma + 1).trim() : 'Live Channel';
                } else if (l.startsWith('http://') || l.startsWith('https://')) {
                    cur.url = l;
                    cur.index = chs.length;
                    chs.push(cur);
                    cur = {};
                }
            }
            return chs;
        }

        let channelData = [];
        let isSyncing = false;

        async function fetchPlaylistText() {
            // 1. Try Local Playlist File (Zee 24 Ghanta + 2,190+ Global Channels)
            try {
                const resp = await fetch(PLAYLIST_LOCAL_URL + `?_t=${Date.now()}`, { cache: 'no-cache' });
                if (resp.ok) {
                    const text = await resp.text();
                    if (text.includes('#EXTINF')) {
                        localStorage.setItem(CACHE_PLAYLIST_KEY, text);
                        localStorage.setItem(CACHE_PLAYLIST_TIME_KEY, Date.now().toString());
                        return text;
                    }
                }
            } catch (e) { console.warn('Local playlist fetch failed, trying remote:', e); }

            // 2. Try Primary Remote Server (Free-TV Global)
            try {
                const cacheBuster = `?_t=${Math.floor(Date.now() / 60000)}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);
                const resp = await fetch(PLAYLIST_REMOTE_URL + cacheBuster, { cache: 'no-cache', signal: controller.signal });
                clearTimeout(timeoutId);
                if (resp.ok) {
                    const text = await resp.text();
                    if (text.includes('#EXTINF')) {
                        localStorage.setItem(CACHE_PLAYLIST_KEY, text);
                        localStorage.setItem(CACHE_PLAYLIST_TIME_KEY, Date.now().toString());
                        return text;
                    }
                }
            } catch (e) { console.warn('Primary remote playlist fetch failed, trying cache:', e); }

            // 3. Try LocalStorage Cache
            const cached = localStorage.getItem(CACHE_PLAYLIST_KEY);
            if (cached && cached.includes('#EXTINF')) return cached;

            // 4. Try Built-in Vault Payload
            try {
                const vaultText = _0xUnlock(_0xVaultPayload, _0xVaultKey);
                if (vaultText && vaultText.includes('#EXTINF')) return vaultText;
            } catch (e) {}

            try {
                const resp = await fetch(PLAYLIST_FREETV_URL);
                if (resp.ok) {
                    const text = await resp.text();
                    if (text.includes('#EXTINF')) return text;
                }
            } catch(e) {}
            throw new Error('All playlist sources failed.');
        }

        async function loadPlaylist(initialPlay = true) {
            if (isSyncing) return;
            isSyncing = true;
            const icon = document.getElementById('cinemaSyncIcon');
            if (icon) icon.classList.add('fa-spin');

            try {
                const text = await fetchPlaylistText();
                const parsed = parseM3U(text);
                if (parsed.length === 0) throw new Error('No channels parsed');
                const prev = channelData[curIdx];
                channelData = parsed;
                initCatChips();
                renderGrid();
                if (initialPlay) {
                    const savedIdx = parseInt(localStorage.getItem('livetv_last_played_idx'), 10);
                    let startIdx = 0;
                    if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < channelData.length) {
                        startIdx = savedIdx;
                    } else {
                        startIdx = channelData.length > 1 ? 1 : 0;
                    }
                    if (channelData.length > 0) playCh(startIdx);
                } else if (prev) {
                    const m = channelData.findIndex(c => c.id === prev.id || c.name.toLowerCase() === prev.name.toLowerCase());
                    if (m !== -1) {
                        curIdx = m;
                        channelData[curIdx].url = channelData[m].url;
                    }
                    renderGrid();
                }
            } catch (e) {
                console.error('Cinema loadPlaylist error:', e);
            } finally {
                isSyncing = false;
                if (icon) icon.classList.remove('fa-spin');
            }
        }
        let curIdx = 0;
        let curCat = 'ALL';
        let hlsInst = null;

        let favorites = JSON.parse(localStorage.getItem('livetv_favorites') || '[]');
        let recents = JSON.parse(localStorage.getItem('livetv_recents') || '[]');

        const video = document.getElementById('cinemaVideo');
        const grid = document.getElementById('cinemaChannelGrid');
        const catBox = document.getElementById('cinemaCategories');
        const search = document.getElementById('cinemaSearch');

        function initCatChips() {
            const groups = {};
            channelData.forEach(c => groups[c.group] = (groups[c.group] || 0) + 1);
            catBox.innerHTML = '';
            
            const addChip = (cat, label) => {
                const btn = document.createElement('button');
                btn.className = `chip-btn ${curCat === cat ? 'active' : ''}`;
                btn.textContent = label;
                btn.onclick = () => {
                    curCat = cat;
                    document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderGrid();
                };
                catBox.appendChild(btn);
            };

            addChip('ALL', `All (${channelData.length})`);
            addChip('FAVORITES', `❤️ Favorites (${favorites.length})`);
            addChip('RECENTS', `🕒 Recent (${recents.length})`);

            Object.keys(groups).sort().forEach(g => {
                addChip(g, `${g} (${groups[g]})`);
            });
        }

        function toggleFav(chId, e) {
            if (e) e.stopPropagation();
            const idx = favorites.indexOf(String(chId));
            if (idx === -1) favorites.push(String(chId));
            else favorites.splice(idx, 1);
            localStorage.setItem('livetv_favorites', JSON.stringify(favorites));
            initCatChips();
            renderGrid();
        }

        function renderGrid() {
            grid.innerHTML = '';
            const q = search.value.trim().toLowerCase();
            let filtered = channelData.filter(c => {
                if (curCat === 'FAVORITES') return favorites.includes(String(c.id));
                if (curCat === 'RECENTS') return recents.includes(String(c.id));
                if (curCat !== 'ALL') return c.group.toLowerCase() === curCat.toLowerCase();
                return true;
            });

            if (curCat === 'RECENTS') {
                filtered.sort((a, b) => recents.indexOf(String(a.id)) - recents.indexOf(String(b.id)));
            }

            if (q) {
                filtered = filtered.filter(c => c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
            }

            filtered.forEach(c => {
                const card = document.createElement('div');
                card.className = `cinema-channel-card ${c.index === curIdx ? 'active' : ''}`;
                card.tabIndex = 0;
                const isDrm = c.url.includes('.mpd') || !!c.licenseKey;
                const isFav = favorites.includes(String(c.id));

                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${c.logo}" alt="${c.name}" onerror="this.src='https://placehold.co/420x300/111/fff?text=${encodeURIComponent(c.name)}'">
                    </div>
                    <div class="card-info">
                        <div class="card-header-v1">
                            <span class="card-chno-v1">#${c.chno}</span>
                            <div class="card-name-text">${c.name}</div>
                        </div>
                        <div class="card-group-text">
                            <span>${c.group}</span>
                            ${isDrm ? '<span class="badge bg-danger" style="font-size:0.6rem;padding:2px 4px;">DRM</span>' : ''}
                            <button class="fav-star-btn ${isFav ? 'active' : ''}" title="Favorite">
                                <i class="${isFav ? 'fas fa-heart text-danger' : 'far fa-heart'}"></i>
                            </button>
                        </div>
                    </div>
                `;
                card.querySelector('.fav-star-btn').onclick = (e) => toggleFav(c.id, e);
                card.onclick = () => playCh(c.index);
                grid.appendChild(card);
            });
        }

        let cinemaStreamRetries = 0;
        let cinemaFragRetries = 0;

        async function playCh(idx, isRetry = false) {
            if (idx < 0 || idx >= channelData.length) return;
            if (!isRetry) {
                cinemaStreamRetries = 0;
                cinemaFragRetries = 0;
            }
            curIdx = idx;
            const ch = channelData[idx];
            localStorage.setItem('livetv_last_played_idx', idx);
            document.getElementById('cinemaChno').textContent = `#${ch.chno} LIVE`;
            document.getElementById('cinemaName').textContent = ch.name;
            document.getElementById('cinemaGroup').textContent = ch.group;

            recents = recents.filter(id => id !== String(ch.id));
            recents.unshift(String(ch.id));
            if (recents.length > 15) recents.pop();
            localStorage.setItem('livetv_recents', JSON.stringify(recents));
            initCatChips();

            if (hlsInst) {
                try {
                    hlsInst.stopLoad();
                    hlsInst.detachMedia();
                    hlsInst.destroy();
                } catch(e) {}
                hlsInst = null;
            }
            try { video.pause(); } catch(e) {}

            document.querySelectorAll('.cinema-channel-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });

            if (Hls.isSupported()) {
                hlsInst = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 60,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10,
                    manifestLoadingTimeOut: 8000,
                    manifestLoadingMaxRetry: 2,
                    manifestLoadingRetryDelay: 500,
                    levelLoadingTimeOut: 8000,
                    levelLoadingMaxRetry: 2,
                    levelLoadingRetryDelay: 500,
                    fragLoadingTimeOut: 10000,
                    fragLoadingMaxRetry: 2,
                    fragLoadingRetryDelay: 500,
                    startLevel: -1,
                    autoStartLoad: true
                });

                const streamUrl = isRetry ? (ch.url + (ch.url.includes('?') ? '&' : '?') + '_t=' + Date.now()) : ch.url;
                hlsInst.loadSource(streamUrl);
                hlsInst.attachMedia(video);

                hlsInst.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    cinemaStreamRetries = 0;
                    cinemaFragRetries = 0;
                    if (!data.levels || data.levels.length === 0) {
                        console.warn('Channel manifest has 0 levels:', ch.name);
                        playCh((curIdx + 1) % channelData.length);
                        return;
                    }
                    video.play().catch(() => { video.muted = true; video.play().catch(e => console.log(e)); });
                });

                hlsInst.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.warn('Cinema HLS fatal error:', data.type, data.details);
                        if (data.details === 'manifestParsingError' || (data.response && (data.response.code >= 500 || data.response.code === 404))) {
                            playCh((curIdx + 1) % channelData.length);
                            return;
                        }
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                if (data.details === 'manifestLoadError') {
                                    if (cinemaStreamRetries < 2) {
                                        cinemaStreamRetries++;
                                        setTimeout(() => playCh(curIdx, true), 1000);
                                    } else {
                                        playCh((curIdx + 1) % channelData.length);
                                    }
                                } else {
                                    cinemaFragRetries++;
                                    if (cinemaFragRetries <= 2) {
                                        hlsInst.startLoad();
                                    } else {
                                        playCh((curIdx + 1) % channelData.length);
                                    }
                                }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInst.recoverMediaError();
                                break;
                            default:
                                playCh((curIdx + 1) % channelData.length);
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(() => { video.muted = true; video.play().catch(e => console.log(e)); });
            } else {
                video.src = ch.url;
                video.play().catch(() => { video.muted = true; video.play().catch(e => console.log(e)); });
            }
        }

        document.getElementById('cinemaReloadBtn').onclick = () => playCh(curIdx);
        search.oninput = renderGrid;

        const themeSelect = document.getElementById('themeSelect');
        themeSelect.onchange = (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
            localStorage.setItem('cinema_theme', e.target.value);
        };

        const cinemaSyncBtn = document.getElementById('cinemaSyncBtn');
        if (cinemaSyncBtn) {
            cinemaSyncBtn.onclick = () => loadPlaylist(false);
        }

        // Auto-refresh playlist every 15 minutes
        setInterval(() => loadPlaylist(false), 15 * 60 * 1000);

        document.addEventListener('DOMContentLoaded', async () => {
            const savedT = localStorage.getItem('cinema_theme') || 'dark';
            themeSelect.value = savedT;
            document.documentElement.setAttribute('data-theme', savedT);

            await loadPlaylist(true);
        });
    </script>
</body>
</html>
