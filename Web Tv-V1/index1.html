    <style>
        :root, [data-theme="dark"] {
            --primary: #e50914;
            --primary-glow: rgba(229, 9, 20, 0.4);
            --bg-base: #0a0a0a;
            --bg-surface: rgba(18, 18, 18, 0.9);
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-color: #f5f5f5;
            --text-muted: #a3a3a3;
            --nav-bg: rgba(10, 10, 10, 0.88);
        }

        [data-theme="light"] {
            --primary: #0d6efd;
            --primary-glow: rgba(13, 110, 253, 0.35);
            --bg-base: #f0f2f5;
            --bg-surface: rgba(255, 255, 255, 0.92);
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-card-hover: rgba(0, 0, 0, 0.06);
            --border-glass: rgba(0, 0, 0, 0.08);
            --text-color: #111827;
            --text-muted: #4b5563;
            --nav-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="green"] {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-base: #061810;
            --bg-surface: rgba(8, 28, 19, 0.9);
            --bg-card: rgba(16, 185, 129, 0.06);
            --bg-card-hover: rgba(16, 185, 129, 0.12);
            --border-glass: rgba(16, 185, 129, 0.15);
            --text-color: #ecfdf5;
            --text-muted: #6ee7b7;
            --nav-bg: rgba(6, 24, 16, 0.9);
        }

        [data-theme="purple"] {
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --bg-base: #0e071c;
            --bg-surface: rgba(22, 12, 42, 0.9);
            --bg-card: rgba(168, 85, 247, 0.06);
            --bg-card-hover: rgba(168, 85, 247, 0.14);
            --border-glass: rgba(168, 85, 247, 0.15);
            --text-color: #faf5ff;
            --text-muted: #c084fc;
            --nav-bg: rgba(14, 7, 28, 0.9);
        }

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top, rgba(229,9,20,0.15) 0%, var(--bg-base) 60%);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding-top: 76px;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Navbar */
        .navbar-custom {
            background-color: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 12px 0;
        }

        .navbar-brand {
            color: var(--text-color) !important;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        .navbar-brand i { color: var(--primary); }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 600;
            font-size: 0.88rem;
            padding: 8px 14px !important;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-color) !important;
            background: var(--bg-card);
        }

        /* Theme Dropdown */
        .theme-select {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        /* Main Layout */
        .cinema-container {
            max-width: 1720px;
            margin: 0 auto;
            padding: 20px;
        }

        .player-sticky {
            position: sticky;
            top: 96px;
            z-index: 50;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glass);
        }

        .player-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cinema-info-bar {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--bg-surface);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
        }

        .now-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-tag {
            background: var(--primary);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Sidebar Channel List */
        .cinema-sidebar {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--border-glass);
            height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-color);
            outline: none;
            font-size: 0.88rem;
            margin-bottom: 12px;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .cat-chips-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .cat-chips-row::-webkit-scrollbar { display: none; }

        .chip-btn {
            white-space: nowrap;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-glass);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip-btn.active, .chip-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .cinema-channel-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
            gap: 10px;
            padding-right: 4px;
            align-content: start;
        }

        .cinema-channel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .cinema-channel-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            background: var(--bg-card-hover);
        }

        .cinema-channel-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary), 0 6px 20px var(--primary-glow);
        }

        .card-img-wrap {
            width: 100%;
            aspect-ratio: 16/10;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .card-img-wrap img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .card-info {
            padding: 6px 8px;
            text-align: center;
            border-top: 1px solid var(--border-glass);
        }

        .card-name-text {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-group-text {
            font-size: 0.68rem;
            color: var(--text-muted);
        }
    </style>
</head>

            document.getElementById('cinemaGroup').textContent = ch.group;

            if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
            if (shakaInst) { await shakaInst.destroy(); shakaInst = null; }

            document.querySelectorAll('.cinema-channel-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });

            const isMpd = ch.url.includes('.mpd');
            if (isMpd && window.shaka && shaka.Player.isBrowserSupported()) {
                shakaInst = new shaka.Player(video);
                if (ch.licenseKey) {
                    shakaInst.configure({ drm: { servers: { 'com.widevine.alpha': ch.licenseKey } } });
                }
                try {
                    await shakaInst.load(ch.url);
                    video.play().catch(() => { video.muted = true; video.play(); });
                } catch(e) { console.error('Shaka load error:', e); }
            } else if (Hls.isSupported() && !isMpd) {
                hlsInst = new Hls();
                hlsInst.loadSource(ch.url);
                hlsInst.attachMedia(video);
                hlsInst.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => { video.muted = true; video.play(); }));
            } else {
                video.src = ch.url;
                video.play().catch(() => { video.muted = true; video.play(); });
            }
        }

        document.getElementById('cinemaReloadBtn').onclick = () => playCh(curIdx);
        search.oninput = renderGrid;

        // Theme Handling
        const themeSelect = document.getElementById('themeSelect');
        themeSelect.onchange = (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
            localStorage.setItem('cinema_theme', e.target.value);
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedT = localStorage.getItem('cinema_theme') || 'dark';
            themeSelect.value = savedT;
            document.documentElement.setAttribute('data-theme', savedT);

            initCatChips();
            renderGrid();
            playCh(0);
        });
    </script>
</body>
</html>
