    <style>
        :root {
            --bg-base: #0f111a;
            --bg-surface: #171926;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.35);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --badge-bg: rgba(255, 255, 255, 0.12);
            --badge-text: #f3f4f6;
            --chip-bg: rgba(255, 255, 255, 0.08);
            --chip-text: #e5e7eb;
        }

        body.light-theme {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --border-color: #e2e8f0;
            --accent: #7c3aed;
            --text-main: #0f172a;
            --text-muted: #475569;
            --badge-bg: #ede9fe;
            --badge-text: #6d28d9;
            --chip-bg: #f1f5f9;
            --chip-text: #334155;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .guide-navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 26, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
        }

        body.light-theme .guide-navbar {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
        }

        .guide-container {
            max-width: 1720px;
            margin: 0 auto;
            padding: 24px;
        }

        .guide-player-card {
            background: var(--bg-surface);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0,0,0,0.2);
        }

        .guide-video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .guide-video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .guide-info-header {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .guide-sidebar {
            background: var(--bg-surface);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 18px;
            height: calc(100vh - 120px);
            min-height: 580px;
            display: flex;
            flex-direction: column;
        }

        .guide-search {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            font-size: 0.88rem;
            margin-bottom: 12px;
        }

        .guide-cat-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .guide-cat-row::-webkit-scrollbar { display: none; }

        .guide-chip {
            white-space: nowrap;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 20px;
            background: var(--chip-bg);
            color: var(--chip-text);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .guide-chip.active {
            background: var(--accent) !important;
            color: #ffffff !important;
            border-color: var(--accent) !important;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .guide-grid-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .guide-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            min-height: 60px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .guide-card:hover, .guide-card:focus-visible {
            transform: translateX(4px);
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 2px var(--accent), 0 4px 16px var(--accent-glow);
        }

        .guide-card.active {
            border-color: var(--accent) !important;
            background: rgba(168, 85, 247, 0.16) !important;
            box-shadow: 0 0 0 1.5px var(--accent), 0 4px 20px var(--accent-glow);
        }

        body.light-theme .guide-card.active {
            background: #f5f3ff !important;
            border-color: #7c3aed !important;
        }

        .guide-thumb-wrap {
            width: 50px;
            min-width: 50px;
            height: 40px;
            border-radius: 8px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .guide-thumb-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .guide-card-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            text-align: left;
        }

        .guide-header-line {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .guide-chno {
            font-size: 0.72rem;
            font-weight: 800;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .guide-card-name {
            font-size: 0.88rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .guide-card-group {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fav-star-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 0.85rem;
        }

        .fav-star-btn.active { color: #ef4444; }
    </style>
</head>

        function _0xUnlock(encData, key) {
            const raw = atob(encData);
            const S = Array.from({length: 256}, (_, i) => i);
            let j = 0;
            const keyBytes = Array.from(key).map(c => c.charCodeAt(0));
            for (let i = 0; i < 256; i++) {
                j = (j + S[i] + keyBytes[i % keyBytes.length]) % 256;
                [S[i], S[j]] = [S[j], S[i]];
            }
            let i = 0; j = 0;
            const out = new Uint8Array(raw.length);
            for (let x = 0; x < raw.length; x++) {
                i = (i + 1) % 256;
                j = (j + S[i]) % 256;
                [S[i], S[j]] = [S[j], S[i]];
                out[x] = raw.charCodeAt(x) ^ S[(S[i] + S[j]) % 256];
            }
            return new TextDecoder().decode(out);
        }

        const PLAYLIST_REMOTE_URL = 'https://toffee.aliflaila.live/playlist.m3u';
        const PLAYLIST_LOCAL_URL = '../toffee_playlist.m3u';
        const CACHE_PLAYLIST_KEY = 'livetv_toffee_v3_aliflaila';
        const CACHE_PLAYLIST_TIME_KEY = 'livetv_toffee_v3_time';

        function parseM3U(data) {
            const lines = data.split('\n');
            const chs = [];
            let cur = {};
            for (let l of lines) {
                l = l.trim();
                if (!l) continue;
                if (l.startsWith('#KODIPROP:inputstream.adaptive.license_key=')) {
                    cur.licenseKey = l.substring(44).trim();
                } else if (l.startsWith('#EXTINF:')) {
                    const idM = l.match(/tvg-id="([^"]+)"/);
                    cur.id = idM ? idM[1] : String(chs.length + 1);
                    const chnoM = l.match(/tvg-chno="([^"]+)"/);
                    cur.chno = chnoM ? chnoM[1] : (chs.length + 1);
                    const logoM = l.match(/tvg-logo="([^"]+)"/);
                    cur.logo = logoM ? logoM[1] : 'https://placehold.co/420x300/1e1e2f/ffffff?text=LIVE%20TV';
                    const grpM = l.match(/group-title="([^"]+)"/);
                    cur.group = grpM ? grpM[1] : 'General';
                    const comma = l.lastIndexOf(',');
                    cur.name = comma !== -1 ? l.substring(comma + 1).trim() : 'Live Channel';
                } else if (l.startsWith('http://') || l.startsWith('https://')) {
                    cur.url = l;
                    cur.index = chs.length;
                    chs.push(cur);
                    cur = {};
                }
            }
            return chs;
        }

        let channelData = [];
        let isSyncing = false;

        async function fetchPlaylistText() {
            // 1. Try Primary Remote Server (toffee.aliflaila.live)
            try {
                const cacheBuster = `?_t=${Math.floor(Date.now() / 60000)}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);
                const resp = await fetch(PLAYLIST_REMOTE_URL + cacheBuster, { cache: 'no-cache', signal: controller.signal });
                clearTimeout(timeoutId);
                if (resp.ok) {
                    const text = await resp.text();
                    if (text.includes('#EXTINF')) {
                        localStorage.setItem(CACHE_PLAYLIST_KEY, text);
                        localStorage.setItem(CACHE_PLAYLIST_TIME_KEY, Date.now().toString());
                        return text;
                    }
                }
            } catch (e) { console.warn('Primary remote playlist fetch failed, trying local fallback:', e); }

            // 2. Try Local Fallback File
            try {
                const resp = await fetch(PLAYLIST_LOCAL_URL + `?_t=${Date.now()}`, { cache: 'no-cache' });
                if (resp.ok) {
                    const text = await resp.text();
                    if (text.includes('#EXTINF')) return text;
                }
            } catch (e) { console.warn('Local playlist fetch failed, trying cache:', e); }

            // 3. Try LocalStorage Cache
            const cached = localStorage.getItem(CACHE_PLAYLIST_KEY);
            if (cached && cached.includes('#EXTINF')) return cached;

            // 4. Try Built-in Vault Payload
            try {
                const vaultText = _0xUnlock(_0xVaultPayload, _0xVaultKey);
                if (vaultText && vaultText.includes('#EXTINF')) return vaultText;
            } catch (e) {}

            throw new Error('All playlist sources failed.');
        }

        async function loadPlaylist(initialPlay = true) {
            if (isSyncing) return;
            isSyncing = true;
            const icon = document.getElementById('guideSyncIcon');
            if (icon) icon.classList.add('fa-spin');

            try {
                const text = await fetchPlaylistText();
                const parsed = parseM3U(text);
                if (parsed.length === 0) throw new Error('No channels parsed');
                const prev = channelData[curIdx];
                channelData = parsed;
                initCatChips();
                renderGrid();
                if (initialPlay) {
                    const savedIdx = parseInt(localStorage.getItem('livetv_last_played_idx'), 10);
                    let startIdx = 0;
                    if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < channelData.length) {
                        startIdx = savedIdx;
                    } else {
                        startIdx = channelData.length > 1 ? 1 : 0;
                    }
                    if (channelData.length > 0) playCh(startIdx);
                } else if (prev) {
                    const m = channelData.findIndex(c => c.id === prev.id || c.name.toLowerCase() === prev.name.toLowerCase());
                    if (m !== -1) {
                        curIdx = m;
                        channelData[curIdx].url = channelData[m].url;
                    }
                    renderGrid();
                }
            } catch (e) {
                console.error('TV Guide loadPlaylist error:', e);
            } finally {
                isSyncing = false;
                if (icon) icon.classList.remove('fa-spin');
            }
        }
        let curIdx = 0;
        let curCat = 'ALL';
        let hlsInst = null;
        let shakaInst = null;

        let favorites = JSON.parse(localStorage.getItem('livetv_favorites') || '[]');
        let recents = JSON.parse(localStorage.getItem('livetv_recents') || '[]');

        if (window.shaka) shaka.polyfill.installAll();

        const video = document.getElementById('guideVideo');
        const grid = document.getElementById('guideChannelGrid');
        const catBox = document.getElementById('guideCategories');
        const search = document.getElementById('guideSearchInput');

        function initCatChips() {
            const groups = {};
            channelData.forEach(c => groups[c.group] = (groups[c.group] || 0) + 1);
            catBox.innerHTML = '';
            
            const addChip = (cat, label) => {
                const btn = document.createElement('button');
                btn.className = `guide-chip ${curCat === cat ? 'active' : ''}`;
                btn.textContent = label;
                btn.onclick = () => {
                    curCat = cat;
                    document.querySelectorAll('.guide-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderGrid();
                };
                catBox.appendChild(btn);
            };

            addChip('ALL', `All (${channelData.length})`);
            addChip('FAVORITES', `❤️ Favorites (${favorites.length})`);
            addChip('RECENTS', `🕒 Recent (${recents.length})`);

            Object.keys(groups).sort().forEach(g => {
                addChip(g, `${g} (${groups[g]})`);
            });
        }

        function toggleFav(chId, e) {
            if (e) e.stopPropagation();
            const idx = favorites.indexOf(String(chId));
            if (idx === -1) favorites.push(String(chId));
            else favorites.splice(idx, 1);
            localStorage.setItem('livetv_favorites', JSON.stringify(favorites));
            initCatChips();
            renderGrid();
        }

        function renderGrid() {
            grid.innerHTML = '';
            const q = search.value.trim().toLowerCase();
            let filtered = channelData.filter(c => {
                if (curCat === 'FAVORITES') return favorites.includes(String(c.id));
                if (curCat === 'RECENTS') return recents.includes(String(c.id));
                if (curCat !== 'ALL') return c.group.toLowerCase() === curCat.toLowerCase();
                return true;
            });

            if (curCat === 'RECENTS') {
                filtered.sort((a, b) => recents.indexOf(String(a.id)) - recents.indexOf(String(b.id)));
            }

            if (q) {
                filtered = filtered.filter(c => c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
            }

            filtered.forEach(c => {
                const card = document.createElement('div');
                card.className = `guide-card ${c.index === curIdx ? 'active' : ''}`;
                card.tabIndex = 0;
                const isDrm = c.url.includes('.mpd') || !!c.licenseKey;
                const isFav = favorites.includes(String(c.id));

                card.innerHTML = `
                    <div class="guide-thumb-wrap">
                        <img src="${c.logo}" alt="${c.name}" onerror="this.src='https://placehold.co/420x300/111/fff?text=${encodeURIComponent(c.name)}'">
                    </div>
                    <div class="guide-card-info">
                        <div class="guide-header-line">
                            <span class="guide-chno">#${c.chno}</span>
                            <div class="guide-card-name">${c.name}</div>
                        </div>
                        <div class="guide-card-group">
                            <span>${c.group}</span>
                            ${isDrm ? '<span class="badge bg-danger" style="font-size:0.6rem;padding:2px 4px;">DRM</span>' : ''}
                            <button class="fav-star-btn ${isFav ? 'active' : ''}" title="Favorite">
                                <i class="${isFav ? 'fas fa-heart text-danger' : 'far fa-heart'}"></i>
                            </button>
                        </div>
                    </div>
                `;
                card.querySelector('.fav-star-btn').onclick = (e) => toggleFav(c.id, e);
                card.onclick = () => playCh(c.index);
                grid.appendChild(card);
            });
        }

        let guideStreamRetries = 0;
        let guideFragRetries = 0;

        async function playCh(idx, isRetry = false) {
            if (idx < 0 || idx >= channelData.length) return;
            if (!isRetry) {
                guideStreamRetries = 0;
                guideFragRetries = 0;
            }
            curIdx = idx;
            const ch = channelData[idx];
            localStorage.setItem('livetv_last_played_idx', idx);
            document.getElementById('guideChno').textContent = `#${ch.chno} LIVE`;
            const t = document.getElementById('guideChTitle'); if (t) t.textContent = ch.name;
            const g = document.getElementById('guideChGroup'); if (g) g.textContent = ch.group;

            recents = recents.filter(id => id !== String(ch.id));
            recents.unshift(String(ch.id));
            if (recents.length > 15) recents.pop();
            localStorage.setItem('livetv_recents', JSON.stringify(recents));
            initCatChips();

            if (hlsInst) {
                try {
                    hlsInst.stopLoad();
                    hlsInst.detachMedia();
                    hlsInst.destroy();
                } catch(e) {}
                hlsInst = null;
            }
            if (shakaInst) {
                try { await shakaInst.destroy(); } catch(e) {}
                shakaInst = null;
            }
            try {
                video.pause();
                video.removeAttribute('src');
                video.load();
            } catch(e) {}

            document.querySelectorAll('.guide-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });

            const isMpd = ch.url.includes('.mpd');
            if (isMpd && window.shaka && shaka.Player.isBrowserSupported()) {
                shakaInst = new shaka.Player(video);
                if (ch.licenseKey) {
                    shakaInst.configure({ drm: { servers: { 'com.widevine.alpha': ch.licenseKey } } });
                }
                try {
                    await shakaInst.load(ch.url);
                    video.play().catch(() => { video.muted = true; video.play().catch(e => console.log(e)); });
                } catch(e) { 
                    console.error('Shaka load error:', e); 
                    playCh((curIdx + 1) % channelData.length);
                }
            } else if (Hls.isSupported() && !isMpd) {
                hlsInst = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 60,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10,
                    manifestLoadingTimeOut: 8000,
                    manifestLoadingMaxRetry: 2,
                    manifestLoadingRetryDelay: 500,
                    levelLoadingTimeOut: 8000,
                    levelLoadingMaxRetry: 2,
                    levelLoadingRetryDelay: 500,
                    fragLoadingTimeOut: 10000,
                    fragLoadingMaxRetry: 2,
                    fragLoadingRetryDelay: 500,
                    startLevel: -1,
                    autoStartLoad: true
                });

                const streamUrl = isRetry ? (ch.url + (ch.url.includes('?') ? '&' : '?') + '_t=' + Date.now()) : ch.url;
                hlsInst.loadSource(streamUrl);
                hlsInst.attachMedia(video);

                hlsInst.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    guideStreamRetries = 0;
                    guideFragRetries = 0;
                    if (!data.levels || data.levels.length === 0) {
                        console.warn('Channel manifest has 0 levels:', ch.name);
                        playCh((curIdx + 1) % channelData.length);
                        return;
                    }
                    video.play().catch(() => { video.muted = true; video.play().catch(e => console.log(e)); });
                });

                hlsInst.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.warn('Guide HLS fatal error:', data.type, data.details);
                        if (data.details === 'manifestParsingError' || (data.response && (data.response.code >= 500 || data.response.code === 404))) {
                            playCh((curIdx + 1) % channelData.length);
                            return;
                        }
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                if (data.details === 'manifestLoadError') {
                                    if (guideStreamRetries < 2) {
                                        guideStreamRetries++;
                                        setTimeout(() => playCh(curIdx, true), 1000);
                                    } else {
                                        playCh((curIdx + 1) % channelData.length);
                                    }
                                } else {
                                    guideFragRetries++;
                                    if (guideFragRetries <= 2) {
                                        hlsInst.startLoad();
                                    } else {
                                        playCh((curIdx + 1) % channelData.length);
                                    }
                                }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInst.recoverMediaError();
                                break;
                            default:
                                playCh((curIdx + 1) % channelData.length);
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(() => { video.muted = true; video.play().catch(e => console.log(e)); });
            } else {
                video.src = ch.url;
                video.play().catch(() => { video.muted = true; video.play().catch(e => console.log(e)); });
            }
        }

        search.oninput = renderGrid;

        const themeToggle = document.getElementById('guideThemeToggle');
        const themeIcon = document.getElementById('guideThemeIcon');
        themeToggle.onclick = () => {
            const isLight = document.body.classList.toggle('light-theme');
            themeIcon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('guide_theme', isLight ? 'light' : 'dark');
        };

        const guideSyncBtn = document.getElementById('guideSyncBtn');
        if (guideSyncBtn) {
            guideSyncBtn.onclick = () => loadPlaylist(false);
        }

        // Auto-refresh playlist every 15 minutes
        setInterval(() => loadPlaylist(false), 15 * 60 * 1000);

        document.addEventListener('DOMContentLoaded', async () => {
            const savedT = localStorage.getItem('guide_theme');
            if (savedT === 'light') {
                document.body.classList.add('light-theme');
                themeIcon.className = 'fas fa-sun';
            }
            await loadPlaylist(true);
        });
    </script>
</body>
</html>
