<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium Live TV Streaming - Watch 54+ HD Channels Online">
    <meta name="theme-color" content="#121212">
    <link rel="shortcut icon" href="https://placehold.co/16x16/e50914/ffffff?text=TV"/>
    <title>Premium Live TV Streaming | 54+ HD Channels</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Video Streaming Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

    <style>
        :root {
            --bg-base: #0c0d14;
            --bg-surface: #141622;
            --bg-card: rgba(25, 28, 44, 0.8);
            --bg-card-hover: rgba(38, 43, 68, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(187, 134, 252, 0.6);
            
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --accent-hover: #9333ea;
            --live-red: #ef4444;

            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;

            --badge-bg: rgba(255, 255, 255, 0.12);
            --badge-text: #f3f4f6;

            --chip-bg: rgba(255, 255, 255, 0.06);
            --chip-text: #e5e7eb;
            --chip-border: rgba(255, 255, 255, 0.14);

            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-pill: 9999px;
            
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-theme {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --border-color: #e2e8f0;
            --border-focus: #7c3aed;

            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --accent-hover: #6d28d9;

            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dim: #64748b;

            --badge-bg: #ede9fe;
            --badge-text: #6d28d9;

            --chip-bg: #f1f5f9;
            --chip-text: #334155;
            --chip-border: #cbd5e1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            background-color: var(--bg-base);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Ambient Glow */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .ambient-blob {
            position: absolute;
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
        }

        .ambient-blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        }

        .ambient-blob-2 {
            bottom: -15%;
            right: -10%;
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
        }

        /* Navbar */
        .app-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(12, 13, 20, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
        }

        body.light-theme .app-navbar {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 1px 10px rgba(0, 0, 0, 0.05);
        }

        .nav-content {
            max-width: 1720px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.25rem;
        }

        .brand-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .live-badge-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--live-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--live-red);
            border-radius: 50%;
            animation: pulse-ring 1.8s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-muted);
            border: 1px solid transparent;
            background: transparent;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .nav-btn:hover {
            color: var(--text-main);
            background: rgba(128, 128, 128, 0.1);
        }

        .nav-btn.active {
            color: var(--accent);
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.3);
        }

        body.light-theme .nav-btn.active {
            color: #7c3aed;
            background: #ede9fe;
            border-color: #ddd6fe;
        }

        .theme-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        /* App Container */
        .app-container {
            max-width: 1720px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Player Section */
        .player-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .player-header {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.04);
        }

        .player-channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .now-playing-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .player-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .player-fav-btn {
            background: none;
            border: none;
            font-size: 1.15rem;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            transition: var(--transition-smooth);
        }

        .player-fav-btn.active {
            color: #ef4444;
            transform: scale(1.15);
        }

        .player-tags {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .player-tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            overflow: hidden;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            padding: 24px;
            text-align: center;
        }

        .video-overlay.active { display: flex; }

        .spinner-custom {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .overlay-msg {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }

        .overlay-btn {
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.88rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }

        /* Toolbar Controls */
        .player-toolbar {
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(0, 0, 0, 0.05);
            border-top: 1px solid var(--border-color);
            position: relative;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            height: 36px;
            padding: 0 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            gap: 6px;
        }

        .tool-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        /* Quality Dropdown Menu */
        .quality-menu {
            position: absolute;
            bottom: 52px;
            right: 120px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            padding: 6px;
            min-width: 150px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
        }

        .quality-menu.show { display: flex; }

        .quality-item {
            padding: 7px 12px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.82rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-smooth);
        }

        .quality-item:hover, .quality-item.active {
            background: var(--accent);
            color: #fff;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            width: 80px;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(128, 128, 128, 0.3);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 6px var(--accent-glow);
        }

        /* Sidebar Channel List */
        .sidebar-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 600px;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .channel-counter-badge {
            font-size: 0.78rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 36px;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
            transition: var(--transition-smooth);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.85rem;
            display: none;
            padding: 4px;
        }

        /* Category Filter Chips */
        .category-scroll {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            white-space: nowrap;
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 700;
            background: var(--chip-bg);
            color: var(--chip-text);
            border: 1px solid var(--chip-border);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .cat-chip:hover {
            color: var(--text-main);
            background: var(--bg-card-hover);
        }

        .cat-chip.active {
            background: var(--accent) !important;
            color: #ffffff !important;
            border-color: var(--accent) !important;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .channels-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .channels-scroll-area::-webkit-scrollbar { width: 6px; }
        .channels-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .channels-scroll-area::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* Channel Card with D-Pad TV Focus */
        .channel-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            min-height: 62px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            position: relative;
            outline: none;
        }

        .channel-card:hover, .channel-card:focus-visible, .channel-card.tv-focused {
            transform: translateX(4px) scale(1.01);
            background: var(--bg-card-hover);
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 2.5px var(--accent), 0 4px 20px var(--accent-glow) !important;
        }

        .channel-card.active {
            border-color: var(--accent) !important;
            background: rgba(168, 85, 247, 0.15) !important;
            box-shadow: 0 0 0 1.5px var(--accent), 0 4px 20px var(--accent-glow);
        }

        body.light-theme .channel-card.active {
            background: #f5f3ff !important;
            border-color: #7c3aed !important;
        }

        .card-thumb-wrapper {
            width: 52px;
            min-width: 52px;
            height: 42px;
            border-radius: 8px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .card-thumb {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-body-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .card-header-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-name-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .card-chno {
            font-size: 0.72rem;
            font-weight: 800;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .card-name {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .card-group {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .card-fav-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 2px 4px;
            transition: var(--transition-smooth);
        }

        .card-fav-btn.active {
            color: #ef4444;
        }

        .card-drm-badge {
            font-size: 0.62rem;
            font-weight: 800;
            background: rgba(168, 85, 247, 0.2);
            color: var(--accent);
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            text-transform: uppercase;
        }

        body.light-theme .card-drm-badge {
            background: #ede9fe;
            color: #6d28d9;
            border-color: #ddd6fe;
        }

        .card-playing-indicator {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .channel-card.active .card-playing-indicator {
            display: flex;
        }

        .eq-bar {
            width: 3px;
            background: var(--accent);
            border-radius: 1px;
            animation: eq-bounce 0.8s ease infinite alternate;
        }

        .eq-bar:nth-child(2) { animation-delay: 0.2s; height: 12px; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; height: 8px; }
        .eq-bar:nth-child(1) { height: 10px; }

        @keyframes eq-bounce {
            0% { height: 3px; }
            100% { height: 14px; }
        }

        .empty-channels {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .app-footer {
            margin-top: 40px;
            padding: 24px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .app-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .keyboard-shortcuts-bar {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .kbd-key {
            display: inline-block;
            padding: 2px 6px;
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="ambient-blob ambient-blob-1"></div>
        <div class="ambient-blob ambient-blob-2"></div>
    </div>

        // --- 1. Category Setup with Favorites & Recents ---

            // Recents Chip

            categoryContainer.appendChild(recBtn);

            // Standard Group Chips

        function createCatChip(catKey, label) {
            const btn = document.createElement('button');
            btn.className = `cat-chip ${selectedCategory === catKey ? 'active' : ''}`;

            btn.tabIndex = 0;

        }

        // --- 2. Favorites & Recents Handlers ---

            } else {
                favorites.splice(idx, 1);
            }
            localStorage.setItem('livetv_favorites', JSON.stringify(favorites));
            updateFavUI();
            initCategories();
            renderChannelGrid();
        }

        function updateFavUI() {
            const curCh = channels[activeIndex];
            const isFav = curCh && favorites.includes(String(curCh.id));
            if (isFav) {
                playerFavBtn.classList.add('active');
                playerFavIcon.className = 'fas fa-heart text-danger';
            } else {
                playerFavBtn.classList.remove('active');
                playerFavIcon.className = 'far fa-heart';

            const sId = String(chId);

                            <span class="card-group">${ch.group}</span>
                            <div class="d-flex align-items-center gap-1">
                                ${isDrm ? '<span class="card-drm-badge">DRM</span>' : ''}
                                <button class="card-fav-btn ${isFav ? 'active' : ''}" title="Favorite">
                                    <i class="${isFav ? 'fas fa-heart text-danger' : 'far fa-heart'}"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                card.querySelector('.card-fav-btn').addEventListener('click', (e) => toggleFavorite(ch.id, e));
                card.addEventListener('click', () => playChannel(ch.index));
                channelGrid.appendChild(card);
            });

            const activeCard = channelGrid.querySelector('.channel-card.active');
            if (activeCard) {
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // --- 4. Video Quality Selector ---
        qualityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityMenu.classList.toggle('show');
        });

        document.addEventListener('click', () => qualityMenu.classList.remove('show'));

        function populateHlsQualityMenu(levels) {
            qualityMenu.innerHTML = '';
            
            // Auto Option
            const autoBtn = document.createElement('button');
            autoBtn.className = `quality-item ${hlsInstance.currentLevel === -1 ? 'active' : ''}`;
            autoBtn.textContent = 'Auto (Best)';
            autoBtn.onclick = () => {
                hlsInstance.currentLevel = -1;
                qualityLabel.textContent = 'Auto';
                document.querySelectorAll('.quality-item').forEach(el => el.classList.remove('active'));
                autoBtn.classList.add('active');
            };
            qualityMenu.appendChild(autoBtn);

            levels.forEach((lvl, idx) => {
                const btn = document.createElement('button');
                btn.className = `quality-item ${hlsInstance.currentLevel === idx ? 'active' : ''}`;
                btn.textContent = `${lvl.height}p (${Math.round(lvl.bitrate / 1000)} kbps)`;
                btn.onclick = () => {
                    hlsInstance.currentLevel = idx;
                    qualityLabel.textContent = `${lvl.height}p`;
                    document.querySelectorAll('.quality-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                };
                qualityMenu.appendChild(btn);
            });
        }

        function populateShakaQualityMenu() {
            if (!shakaPlayer) return;
            qualityMenu.innerHTML = '';

            const autoBtn = document.createElement('button');
            autoBtn.className = 'quality-item active';
            autoBtn.textContent = 'Auto (Best)';
            autoBtn.onclick = () => {
                shakaPlayer.configure({ abr: { enabled: true } });
                qualityLabel.textContent = 'Auto';
                document.querySelectorAll('.quality-item').forEach(el => el.classList.remove('active'));
                autoBtn.classList.add('active');
            };
            qualityMenu.appendChild(autoBtn);

            const tracks = shakaPlayer.getVariantTracks();
            const uniqueHeights = [...new Set(tracks.map(t => t.height).filter(Boolean))].sort((a, b) => b - a);

            uniqueHeights.forEach(h => {
                const btn = document.createElement('button');
                btn.className = 'quality-item';
                btn.textContent = `${h}p HD`;
                btn.onclick = () => {
                    const track = tracks.find(t => t.height === h);
                    if (track) {
                        shakaPlayer.configure({ abr: { enabled: false } });
                        shakaPlayer.selectVariantTrack(track, true);
                        qualityLabel.textContent = `${h}p`;
                        document.querySelectorAll('.quality-item').forEach(el => el.classList.remove('active'));
                        btn.classList.add('active');
                    }
                };
                qualityMenu.appendChild(btn);
            });
        }

        // --- 5. Play Channel Engine ---
        async function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            activeIndex = index;
            const ch = channels[activeIndex];

            nowPlayingBadge.textContent = `#${ch.chno} LIVE`;
            playerChannelTitle.textContent = ch.name;
            playerGroupTag.textContent = ch.group;
            updateFavUI();
            recordRecent(ch.id);

            const isMpd = ch.url.includes('.mpd') || ch.url.includes('format=.mpd');
            playerStreamTypeTag.textContent = isMpd ? 'DASH / DRM' : 'HLS';

            loadingOverlay.classList.add('active');
            errorOverlay.classList.remove('active');
            qualityLabel.textContent = 'Auto';

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (shakaPlayer) {
                try {
                    await shakaPlayer.destroy();
                } catch (e) {
                    console.warn('Shaka cleanup error:', e);
                }
                shakaPlayer = null;
            }

            document.querySelectorAll('.channel-card').forEach(c => {
                const isActive = parseInt(c.dataset.index, 10) === activeIndex;
                c.classList.toggle('active', isActive);
            });

            try {
                if (isMpd && window.shaka && shaka.Player.isBrowserSupported()) {
                    shakaPlayer = new shaka.Player(videoElement);

                    if (ch.licenseKey) {
                        shakaPlayer.configure({
                            drm: {
                                servers: {
                                    'com.widevine.alpha': ch.licenseKey
                                }
                            }
                        });
                    }

                    shakaPlayer.addEventListener('error', () => handleStreamError(ch));
                    await shakaPlayer.load(ch.url);
                    populateShakaQualityMenu();
                    loadingOverlay.classList.remove('active');
                    videoElement.play().catch(handleAutoplayBlock);
                } else if (Hls.isSupported() && !isMpd) {
                    hlsInstance = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        manifestLoadingMaxRetry: 3
                    });

                    hlsInstance.loadSource(ch.url);
                    hlsInstance.attachMedia(videoElement);

                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                        populateHlsQualityMenu(data.levels || []);
                        loadingOverlay.classList.remove('active');
                        videoElement.play().catch(handleAutoplayBlock);
                    });

                    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hlsInstance.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hlsInstance.recoverMediaError();
                                    break;
                                default:
                                    handleStreamError(ch);
                                    break;
                            }
                        }
                    });
                } else {
                    videoElement.src = ch.url;
                    loadingOverlay.classList.remove('active');
                    videoElement.play().catch(handleAutoplayBlock);
                }
            } catch (err) {
                console.error('Playback initialization error:', err);
                handleStreamError(ch);
            }
        }

        function handleAutoplayBlock() {
            videoElement.muted = true;
            updateVolumeUI();
            videoElement.play().catch(e => console.log('Muted autoplay blocked:', e));
        }

        function handleStreamError(ch) {
            loadingOverlay.classList.remove('active');
            errorOverlay.classList.add('active');
            document.getElementById('errorMsg').textContent = `Failed to load "${ch.name}". Stream might be offline.`;
        }

        function updatePlayPauseIcon() {
            playPauseIcon.className = videoElement.paused ? 'fas fa-play' : 'fas fa-pause';
        }

        videoElement.addEventListener('play', updatePlayPauseIcon);
        videoElement.addEventListener('pause', updatePlayPauseIcon);
        videoElement.addEventListener('playing', () => loadingOverlay.classList.remove('active'));
        videoElement.addEventListener('waiting', () => loadingOverlay.classList.add('active'));

        playPauseBtn.addEventListener('click', () => {
            if (videoElement.paused) videoElement.play();
            else videoElement.pause();
        });

        prevBtn.addEventListener('click', () => {
            playChannel((activeIndex - 1 + channels.length) % channels.length);
        });

        nextBtn.addEventListener('click', () => {
            playChannel((activeIndex + 1) % channels.length);
        });

        reloadBtn.addEventListener('click', () => playChannel(activeIndex));
        retryBtn.addEventListener('click', () => playChannel(activeIndex));
        nextChannelBtn.addEventListener('click', () => playChannel((activeIndex + 1) % channels.length));

        function updateVolumeUI() {
            volumeSlider.value = videoElement.muted ? 0 : videoElement.volume;
            if (videoElement.muted || videoElement.volume === 0) {
                volumeIcon.className = 'fas fa-volume-xmark text-danger';
            } else if (videoElement.volume < 0.5) {
                volumeIcon.className = 'fas fa-volume-low';
            } else {
                volumeIcon.className = 'fas fa-volume-high';
            }
            localStorage.setItem('livetv_volume', videoElement.volume);
            localStorage.setItem('livetv_muted', videoElement.muted);
        }

        muteBtn.addEventListener('click', () => {
            videoElement.muted = !videoElement.muted;
            updateVolumeUI();
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            videoElement.volume = val;
            videoElement.muted = val === 0;
            updateVolumeUI();
        });

        pipBtn.addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) await document.exitPictureInPicture();
                else if (document.pictureInPictureEnabled) await videoElement.requestPictureInPicture();
            } catch (err) {
                console.error('PiP error:', err);
            }
        });

        fullscreenBtn.addEventListener('click', () => {
            const wrapper = document.querySelector('.video-wrapper');
            if (!document.fullscreenElement) {
                (wrapper.requestFullscreen || wrapper.webkitRequestFullscreen || wrapper.msRequestFullscreen).call(wrapper);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
            }
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            searchClear.style.display = searchQuery ? 'block' : 'none';
            renderChannelGrid();
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            searchClear.style.display = 'none';
            renderChannelGrid();
            searchInput.focus();
        });

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function applyTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-theme');
                themeIcon.className = 'fas fa-sun';
            } else {
                document.body.classList.remove('light-theme');
                themeIcon.className = 'fas fa-moon';
            }
            localStorage.setItem('livetv_theme', theme);
        }

        const savedTheme = localStorage.getItem('livetv_theme') || 'dark';
        applyTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
            const isLight = document.body.classList.contains('light-theme');
            applyTheme(isLight ? 'dark' : 'light');
        });

        // --- 6. D-Pad TV Remote & Keyboard Navigation ---
        document.addEventListener('keydown', (e) => {
            if (document.activeElement === searchInput) {
                if (e.key === 'Escape') searchInput.blur();
                return;
            }

            const focused = document.activeElement;
            const isCard = focused && focused.classList.contains('channel-card');

            if (e.key === '/') {
                e.preventDefault();
                searchInput.focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (isCard) {
                    const prev = focused.previousElementSibling;
                    if (prev && prev.classList.contains('channel-card')) {
                        prev.focus();
                        prev.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                } else {
                    playChannel((activeIndex - 1 + channels.length) % channels.length);
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (isCard) {
                    const next = focused.nextElementSibling;
                    if (next && next.classList.contains('channel-card')) {
                        next.focus();
                        next.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                } else {
                    playChannel((activeIndex + 1) % channels.length);
                }
            } else if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                playPauseBtn.click();
            } else if (e.key === 'm' || e.key === 'M') {
                e.preventDefault();
                muteBtn.click();
            } else if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                fullscreenBtn.click();
            } else if (e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                pipBtn.click();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedVol = localStorage.getItem('livetv_volume');
            if (savedVol !== null) videoElement.volume = parseFloat(savedVol);
            const savedMute = localStorage.getItem('livetv_muted');
            if (savedMute !== null) videoElement.muted = savedMute === 'true';
            updateVolumeUI();

            initCategories();
            renderChannelGrid();
            if (channels.length > 0) playChannel(0);
        });
    </script>
</body>
</html>
